[package]
name = "tadak"
version = "0.1.3"
edition = "2021"
description = "A distraction-free terminal writing app with big pixel fonts, a mechanical-typewriter feel, and live Hangul (Korean) jamo-by-jamo composition."
repository = "https://github.com/andy5090/tadak"
homepage = "https://github.com/andy5090/tadak"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["terminal", "writing", "hangul", "korean", "tui"]
categories = ["command-line-utilities", "text-editors"]

[[bin]]
name = "tadak"
path = "src/main.rs"

[[bin]]
name = "tadak-update"
path = "src/bin/tadak-update.rs"

[dependencies]
crossterm = "0.28"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[profile.release]
opt-level = 3
lto = true

# Release archives are built through cargo-dist. Thin LTO keeps CI release
# builds fast while retaining most of the optimization benefit.
[profile.dist]
inherits = "release"
lto = "thin"
