[package]
name = "termleaf"
version = "0.3.6"
edition = "2021"
description = "A distraction-free terminal text editor built for focused writing."
repository = "https://github.com/andy5090/termleaf"
homepage = "https://github.com/andy5090/termleaf"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["terminal", "writing", "hangul", "korean", "tui"]
categories = ["command-line-utilities", "text-editors"]

[[bin]]
name = "termleaf"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[patch.crates-io]
# CPAL 0.17.3 overflows when converting ALSA timestamps on 32-bit Linux,
# terminating the audio callback thread on its first buffer. The vendored copy
# backports upstream RustAudio/cpal#1137 until Rodio accepts CPAL 0.18.
cpal = { path = "vendor/cpal" }

[profile.release]
opt-level = 3
lto = true

# Release archives are built through cargo-dist. Thin LTO keeps CI release
# builds fast while retaining most of the optimization benefit.
[profile.dist]
inherits = "release"
lto = "thin"
