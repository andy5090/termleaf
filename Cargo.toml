[package]
name = "termleaf"
version = "0.6.0"
edition = "2021"
description = "A distraction-free terminal editor for prose, with cursor-side big type and optional typewriter sound."
repository = "https://github.com/andy5090/termleaf"
homepage = "https://termleaf.com"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["terminal", "writing", "hangul", "korean", "tui"]
categories = ["command-line-utilities", "text-editors"]

[[bin]]
name = "termleaf"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
libakaza = { git = "https://github.com/akaza-im/akaza.git", rev = "33e5e422810377190f55551acf2510d8954c29d5" }

[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[patch.crates-io]
# CPAL 0.17.3 overflows when converting ALSA timestamps on 32-bit Linux,
# terminating the audio callback thread on its first buffer. The vendored copy
# backports upstream RustAudio/cpal#1137 until Rodio accepts CPAL 0.18.
cpal = { path = "vendor/cpal" }
# rsmarisa 0.4.2 translates a C++ pointer expression into unsigned subtraction
# in predictive prefix search. Akaza reaches the underflow with normal Japanese
# dictionary queries, so the vendored copy preserves the initial query offset.
rsmarisa = { path = "vendor/rsmarisa" }

[profile.release]
opt-level = 3
lto = true

# Release archives are built through cargo-dist. Thin LTO keeps CI release
# builds fast while retaining most of the optimization benefit.
[profile.dist]
inherits = "release"
lto = "thin"
