[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
hosting = "github"
# Tadak ships its own updater so version checks use the installed executable,
# rather than cargo-dist's receipt metadata.
install-updater = false

[dist.dependencies.apt]
libasound2-dev = "*"
