[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
pr-run-mode = "skip"
installers = []
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
local-artifacts-jobs = ["./build-i686"]
install-path = "CARGO_HOME"
hosting = "github"
# `termleaf update` uses the installed executable version and the shared release
# installer rather than cargo-dist's receipt metadata.
install-updater = false

[dist.dependencies.apt]
libasound2-dev = "*"

[[dist.extra-artifacts]]
artifacts = ["termleaf-installer.sh"]
build = ["sh", "-n", "termleaf-installer.sh"]

[[dist.extra-artifacts]]
artifacts = [
  "termleaf-language-ko.tar.xz",
  "termleaf-language-ko.tar.xz.sha256",
  "termleaf-language-ja.tar.xz",
  "termleaf-language-ja.tar.xz.sha256",
]
build = ["sh", "tools/package_language_packs.sh"]
