[package]
name = "termleaf-desktop"
version = "0.1.0"
description = "Termleaf local writing desktop app"
authors = ["Termleaf contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "termleaf_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
termleaf = { path = "../../.." }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
cpal = { path = "../../../vendor/cpal" }
rsmarisa = { path = "../../../vendor/rsmarisa" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
